name: Astro website

on:
  push:
    branches: [rebuild/astro]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      live_release:
        description: Fetch the current GitHub release for the preview
        type: boolean
        default: false
  workflow_call:
    inputs:
      publish:
        description: Build and publish the approved production site
        type: boolean
        default: false
      live_release:
        description: Fetch the current GitHub release for the preview
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: >-
      !inputs.publish ||
      (github.repository == 'eso-addons-manager/eso-addons-manager.github.io' &&
       github.ref == 'refs/heads/main' &&
       contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name))
    runs-on: ubuntu-latest
    outputs:
      pages_artifact: ${{ steps.pages_artifact.outcome == 'success' && env.PAGES_ARTIFACT_NAME || '' }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76412c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for changes since the last deployment
        id: refresh
        if: ${{ inputs.publish && github.event_name == 'schedule' }}
        env:
          ESO_RELEASE_SNAPSHOT_PATH: ${{ runner.temp }}/eso-release.json
        run: node scripts/prepare-scheduled-release.mjs

      - name: Lint Astro and TypeScript
        if: ${{ steps.refresh.outputs.should_build != 'false' }}
        run: npm run lint

      - name: Check Astro and TypeScript types
        if: ${{ steps.refresh.outputs.should_build != 'false' }}
        run: npm run check

      - name: Run automated tests
        if: ${{ steps.refresh.outputs.should_build != 'false' }}
        run: npm test

      - name: Validate content and build Astro
        if: ${{ steps.refresh.outputs.should_build != 'false' }}
        env:
          ESO_RELEASE_MODE: ${{ (inputs.publish || inputs.live_release) && 'live' || 'snapshot' }}
          ESO_RELEASE_SNAPSHOT_PATH: ${{ steps.refresh.outputs.snapshot_path }}
        run: npm run build

      - name: Verify the static artifact
        id: verify
        if: ${{ steps.refresh.outputs.should_build != 'false' }}
        run: npm run verify:build

      - name: Upload preview artifact
        if: ${{ !inputs.publish && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: astro-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: website/dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub Pages artifact
        id: pages_artifact
        if: ${{ inputs.publish && steps.verify.outcome == 'success' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: website/dist/

  deploy:
    if: ${{ inputs.publish && needs.build.outputs.pages_artifact != '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: false

      - name: Check that the build commit is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            printf '%s\n' 'current=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'main advanced after the build started. Skipping deployment.'
            printf '%s\n' 'current=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ steps.current.outputs.current == 'true' }}
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.build.outputs.pages_artifact }}
